services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      STOCKTRADE_IBKR_HOST: host.docker.internal
      STOCKTRADE_IBKR_PAPER_PORTS: "4002,7497"
      STOCKTRADE_IBKR_LIVE_PORTS: "4001,7496"
      STOCKTRADE_IBKR_CLIENT_ID: "7"
      STOCKTRADE_ENABLE_LIVE_TRADING: "true"
    ports:
      - "8000:8000"
    volumes:
      - stocktrade-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  stocktrade-data:
